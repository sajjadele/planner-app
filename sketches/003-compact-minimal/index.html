<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Planner - Compact Minimal Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #FFFFFF;
    min-height: 100vh;
    padding: 16px;
    direction: rtl;
  }
  .container { max-width: 400px; margin: 0 auto; }
  
  /* Ultra-compact card - barely a card */
  .card {
    background: #FAFAFA;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #F0F0F0;
  }
  
  /* One-line header */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .card-title { font-size: 14px; font-weight: 600; color: #1A1A1A; }
  .card-icon { font-size: 18px; }
  
  /* Inline progress: bar + value */
  .progress-inline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: #EEEEEE;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 66%;
    background: #8B5CF6;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-value {
    font-size: 16px;
    font-weight: 700;
    color: #8B5CF6;
    min-width: 44px;
    text-align: left;
  }
  
  /* Stats inline */
  .stats-inline {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8E8E93;
    margin-bottom: 12px;
  }
  .stats-inline strong { color: #1A1A1A; font-weight: 600; }
  
  /* Detail rows - very compact */
  .detail-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid #F0F0F0;
  }
  .detail-row:first-child { border-top: none; }
  .detail-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-fire { background: #FF9F0A; }
  .dot-cal { background: #007AFF; }
  .dot-info { background: #8E8E93; }
  .detail-icon { font-size: 13px; }
  .detail-text { font-size: 12px; color: #3A3A3C; }
  .detail-text strong { color: #1A1A1A; font-weight: 600; }
  
  /* Header */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .app-title { font-size: 20px; font-weight: 700; color: #1A1A1A; }
  .app-date { font-size: 12px; color: #8E8E93; margin-top: 1px; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #F5F5F5;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #1A1A1A;
  }
  .icon-btn:hover { background: #EEEEEE; }
  .icon-btn.primary { background: #8B5CF6; color: white; }
  .icon-btn svg { width: 18px; height: 18px; }
  
  /* Day Selector - minimal */
  .day-selector {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .day-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: #F5F5F5;
    font-size: 12px;
    font-weight: 600;
    color: #8E8E93;
    cursor: pointer;
    flex-shrink: 0;
  }
  .day-btn:hover { background: #EEEEEE; }
  .day-btn.selected { background: #8B5CF6; color: white; }
  
  /* Task Card - minimal */
  .task-card {
    background: #FAFAFA;
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #F0F0F0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .task-checkbox {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 2px solid #C7C7CC;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: #FFFFFF;
    color: transparent;
  }
  .task-checkbox.checked { background: #8B5CF6; border-color: #8B5CF6; color: white; }
  .task-name { font-size: 14px; font-weight: 400; color: #1A1A1A; flex: 1; }
  .task-name.completed { text-decoration: line-through; color: #8E8E93; }
  .delete-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #F5F5F5;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #FF3B30;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: #1A1A1A;
  }
  .section-count { color: #8E8E93; font-weight: 400; }
  .section-count strong { color: #1A1A1A; }
  
  /* FAB - smaller */
  .fab {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    border-radius: 24px;
    background: #8B5CF6;
    border: none;
    box-shadow: 0 3px 10px rgba(139,92,246,0.35);
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Bottom Nav - minimal */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #FFFFFF;
    border-top: 1px solid #E8E8ED;
    padding: 10px 20px 18px;
    display: flex;
    justify-content: center;
  }
  .nav-item {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #F5F5F5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: none;
    cursor: pointer;
  }
  .nav-item:hover { background: #EEEEEE; }
  .nav-item.active { background: #8B5CF6; }
  .nav-icon { font-size: 18px; }
  .nav-label { font-size: 9px; font-weight: 500; color: #8E8E93; }
  .nav-item.active .nav-label,
  .nav-item.active .nav-icon { color: white; }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header class="app-header">
    <div>
      <h1 class="app-title">Vision Planner</h1>
      <p class="app-date">سه‌شنبه، ۷ ژوئیه</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg></button>
      <button class="icon-btn primary" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
    </div>
  </header>

  <!-- Main Card -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">آمار هفته</h2>
      <span class="card-icon">📊</span>
    </div>

    <div class="progress-inline">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <span class="progress-value">66%</span>
    </div>

    <div class="stats-inline">
      <span>انجام شده: <strong>۲</strong></span>
      <span>کل: <strong>۳</strong></span>
    </div>

    <div class="detail-row">
      <div class="detail-dot dot-fire"></div>
      <span class="detail-icon">🔥</span>
      <span class="detail-text"><strong>۱</strong> روز پشت‌سرهم</span>
    </div>
    <div class="detail-row">
      <div class="detail-dot dot-cal"></div>
      <span class="detail-icon">📅</span>
      <span class="detail-text">بهترین: <strong>چهارشنبه</strong> (۱)</span>
    </div>
    <div class="detail-row">
      <div class="detail-dot dot-info"></div>
      <span class="detail-icon">ℹ️</span>
      <span class="detail-text"><strong>۳</strong> بدون دسته‌بندی</span>
    </div>
  </div>

  <!-- Day Selector -->
  <div class="day-selector">
    <button class="day-btn">ش</button>
    <button class="day-btn">ی</button>
    <button class="day-btn">د</button>
    <button class="day-btn selected">س</button>
    <button class="day-btn">چ</button>
    <button class="day-btn">پ</button>
    <button class="day-btn">ج</button>
  </div>

  <!-- Task Section -->
  <div class="section-header">
    <span>برنامه‌های سه‌شنبه</span>
    <span class="section-count">از <strong>۱</strong> انجام شده <strong>۱</strong></span>
  </div>
  <div class="task-card">
    <div class="task-checkbox checked">✓</div>
    <span class="task-name completed">سلام</span>
    <button class="delete-btn">🗑</button>
  </div>

  <!-- FAB -->
  <button class="fab" aria-label="Add task">+</button>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">📅</span>
      <span class="nav-label">وظایف</span>
    </button>
  </nav>
</div>
</body>
</html>
