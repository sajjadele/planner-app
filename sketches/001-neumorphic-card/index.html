<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Planner - Neumorphic Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #E8ECF0;
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
  }
  .container { max-width: 400px; margin: 0 auto; }
  
  /* Neumorphic card */
  .card {
    background: #E8ECF0;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 
      8px 8px 16px #BEC3CB,
      -8px -8px 16px #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 150%;
    height: 150%;
    background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(99,102,241,0.04) 100%);
    pointer-events: none;
  }
  
  /* Circular Progress */
  .progress-wrapper {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
  }
  .progress-ring {
    transform: rotate(-90deg);
    width: 140px;
    height: 140px;
  }
  .progress-bg {
    fill: none;
    stroke: #D1D5DB;
    stroke-width: 8;
  }
  .progress-fg {
    fill: none;
    stroke: url(#purpleGrad);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 377;
    stroke-dashoffset: calc(377 * (1 - 0.66));
    transition: stroke-dashoffset 0.6s ease;
  }
  .progress-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .progress-value { font-size: 32px; font-weight: 800; color: #1F2937; }
  .progress-label { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  
  defs { display: none; }
  
  /* Stats row */
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-pill {
    background: rgba(139,92,246,0.1);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #8B5CF6;
  }
  .stat-pill strong { color: #1F2937; }
  
  /* Detail rows */
  .detail-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(0,0,0,0.04);
  }
  .detail-row:first-child { border-top: none; }
  .detail-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .indicator-fire { background: #F97316; }
  .indicator-cal { background: #3B82F6; }
  .indicator-info { background: #9CA3AF; }
  .detail-icon { font-size: 16px; }
  .detail-text { font-size: 14px; color: #4B5563; font-weight: 500; }
  .detail-text strong { color: #1F2937; }
  
  /* Calendar 3D */
  .calendar-3d {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 56px;
    height: 64px;
    background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%);
    border-radius: 8px;
    box-shadow: 
      4px 4px 8px rgba(0,0,0,0.15),
      inset -2px -2px 4px rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    transform: perspective(100px) rotateY(-15deg) rotateX(5deg);
  }
  .cal-month { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-day { font-size: 28px; font-weight: 800; line-height: 1; }
  
  /* Header */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    padding: 0 4px;
  }
  .app-title { font-size: 28px; font-weight: 800; color: #1F2937; }
  .app-date { font-size: 14px; color: #6B7280; margin-top: 4px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #E8ECF0;
    border: none;
    box-shadow: 
      4px 4px 8px #BEC3CB,
      -4px -4px 8px #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .icon-btn:active { box-shadow: inset 4px 4px 8px #BEC3CB, inset -4px -4px 8px #FFFFFF; }
  .icon-btn.purple { background: #8B5CF6; box-shadow: 4px 4px 8px #6D28D9, -4px -4px 8px #A78BFA; }
  .icon-btn svg { width: 20px; height: 20px; color: white; }
  
  /* Day Selector */
  .day-selector {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .day-btn {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    border: none;
    background: #E8ECF0;
    box-shadow: 
      3px 3px 6px #BEC3CB,
      -3px -3px 6px #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    color: #6B7280;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .day-btn.selected {
    background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
    color: white;
    box-shadow: 
      4px 4px 10px rgba(139,92,246,0.4),
      inset -2px -2px 4px rgba(255,255,255,0.1);
  }
  
  /* Task Card */
  .task-card {
    background: #E8ECF0;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 
      4px 4px 8px #BEC3CB,
      -4px -4px 8px #FFFFFF;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .task-checkbox {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 2px solid #9CA3AF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: #E8ECF0;
  }
  .task-checkbox.checked {
    background: #8B5CF6;
    border-color: #8B5CF6;
    color: white;
  }
  .task-name { font-size: 15px; font-weight: 500; color: #1F2937; flex: 1; }
  .task-name.completed { text-decoration: line-through; color: #9CA3AF; }
  .delete-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #E8ECF0;
    border: none;
    box-shadow: 3px 3px 6px #BEC3CB, -3px -3px 6px #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #EF4444;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
  }
  .section-count { color: #9CA3AF; font-weight: 400; }
  
  /* FAB */
  .fab {
    position: fixed;
    bottom: 32px;
    left: 32px;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
    border: none;
    box-shadow: 
      6px 6px 12px rgba(139,92,246,0.4),
      -6px -6px 12px rgba(255,255,255,0.1);
    color: white;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #E8ECF0;
    border-radius: 24px 24px 0 0;
    padding: 16px 20px 24px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    display: flex;
    justify-content: center;
  }
  .nav-item {
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: #E8ECF0;
    box-shadow: 
      3px 3px 6px #BEC3CB,
      -3px -3px 6px #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: none;
    cursor: pointer;
  }
  .nav-item.active {
    background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
    box-shadow: 
      4px 4px 10px rgba(139,92,246,0.4),
      inset -2px -2px 4px rgba(255,255,255,0.1);
  }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 11px; font-weight: 600; color: #6B7280; }
  .nav-item.active .nav-label,
  .nav-item.active .nav-icon { color: white; }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header class="app-header">
    <div>
      <h1 class="app-title">Vision Planner</h1>
      <p class="app-date">سه‌شنبه، ۷ ژوئیه</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg></button>
      <button class="icon-btn purple" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
    </div>
  </header>

  <!-- Main Card -->
  <div class="card">
    <div class="calendar-3d">
      <span class="cal-month">Juy</span>
      <span class="cal-day">17</span>
    </div>

    <div class="progress-wrapper">
      <svg class="progress-ring" viewBox="0 0 140 140">
        <circle class="progress-bg" cx="70" cy="70" r="60"></circle>
        <circle class="progress-fg" cx="70" cy="70" r="60"></circle>
      </svg>
      <defs>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8B5CF6"></stop>
          <stop offset="100%" stop-color="#7C3AED"></stop>
        </linearGradient>
      </defs>
      <div class="progress-center">
        <div class="progress-value">66%</div>
        <div class="progress-label">تکمیل</div>
      </div>
    </div>

    <div class="stats-row">
      <span class="stat-pill">از <strong>۳</strong> تسک تمام شد <strong>۲</strong></span>
    </div>

    <div class="detail-row">
      <div class="detail-indicator indicator-fire"></div>
      <span class="detail-icon">🔥</span>
      <span class="detail-text"><strong>۱</strong> روز پشت‌سرهم تسک کامل شده</span>
    </div>
    <div class="detail-row">
      <div class="detail-indicator indicator-cal"></div>
      <span class="detail-icon">📅</span>
      <span class="detail-text">بهترین روز: <strong>چهارشنبه</strong> (<strong>۱</strong> تسک)</span>
    </div>
    <div class="detail-row">
      <div class="detail-indicator indicator-info"></div>
      <span class="detail-icon">ℹ️</span>
      <span class="detail-text"><strong>۳</strong> تسک بدون دسته‌بندی</span>
    </div>
  </div>

  <!-- Day Selector -->
  <div class="day-selector">
    <button class="day-btn">ش</button>
    <button class="day-btn">ی</button>
    <button class="day-btn">د</button>
    <button class="day-btn selected">س</button>
    <button class="day-btn">چ</button>
    <button class="day-btn">پ</button>
    <button class="day-btn">ج</button>
  </div>

  <!-- Task Section -->
  <div class="section-header">
    <span>برنامه‌های سه‌شنبه</span>
    <span class="section-count">از <strong>۱</strong> انجام شده <strong>۱</strong></span>
  </div>
  <div class="task-card">
    <div class="task-checkbox checked">✓</div>
    <span class="task-name completed">سلام</span>
    <button class="delete-btn">🗑</button>
  </div>

  <!-- FAB -->
  <button class="fab" aria-label="Add task">+</button>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">📅</span>
      <span class="nav-label">وظایف</span>
    </button>
  </nav>
</div>
</body>
</html>
