<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Decorative grid -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Left side: Title -->
  <g transform="translate(80, 80)">
    <!-- Category -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#A78BFA" letter-spacing="3" font-weight="500">ANDROID • OFFLINE-FIRST • GOAL-ORIENTED</text>
    
    <!-- Project name -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="white" font-weight="700">Vision</text>
    <text x="220" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="56" fill="url(#purple)" font-weight="700">Planner</text>
    
    <!-- Tagline -->
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94A3B8">Goal-oriented progress system that helps you</text>
    <text x="0" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94A3B8">understand your progress and improve your path.</text>
    
    <!-- Flow diagram -->
    <g transform="translate(0, 170)">
      <text x="0" y="0" font-family="monospace" font-size="16" fill="#8B5CF6">Goal</text>
      <text x="70" y="0" font-family="monospace" font-size="16" fill="#64748B">→</text>
      <text x="100" y="0" font-family="monospace" font-size="16" fill="#8B5CF6">Task</text>
      <text x="155" y="0" font-family="monospace" font-size="16" fill="#64748B">→</text>
      <text x="185" y="0" font-family="monospace" font-size="16" fill="#8B5CF6">Event</text>
      <text x="255" y="0" font-family="monospace" font-size="16" fill="#64748B">→</text>
      <text x="285" y="0" font-family="monospace" font-size="16" fill="#8B5CF6">Snapshot</text>
      <text x="385" y="0" font-family="monospace" font-size="16" fill="#64748B">→</text>
      <text x="415" y="0" font-family="monospace" font-size="16" fill="#8B5CF6">Mirror</text>
    </g>
    
    <!-- Stats -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="120" height="50" rx="8" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="60" y="22" font-family="monospace" font-size="20" fill="#8B5CF6" text-anchor="middle" font-weight="700">20+</text>
      <text x="60" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">FEATURES</text>
      
      <rect x="140" y="0" width="120" height="50" rx="8" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="200" y="22" font-family="monospace" font-size="20" fill="#8B5CF6" text-anchor="middle" font-weight="700">100%</text>
      <text x="200" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">OFFLINE</text>
      
      <rect x="280" y="0" width="120" height="50" rx="8" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="340" y="22" font-family="monospace" font-size="20" fill="#8B5CF6" text-anchor="middle" font-weight="700">v14</text>
      <text x="340" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">DATABASE</text>
    </g>
  </g>
  
  <!-- Right side: Solar System visualization -->
  <g transform="translate(850, 200)">
    <!-- Sun (Goal) -->
    <circle cx="0" cy="0" r="40" fill="#8B5CF6" opacity="0.2"/>
    <circle cx="0" cy="0" r="25" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="#8B5CF6"/>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="700">GOAL</text>
    
    <!-- Orbit 1 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="60" cy="-53" r="8" fill="#A78BFA"/>
    <circle cx="-70" cy="35" r="6" fill="#C4B5FD"/>
    
    <!-- Orbit 2 -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="100" cy="-80" r="10" fill="#8B5CF6"/>
    <circle cx="-110" cy="60" r="7" fill="#A78BFA"/>
    <circle cx="50" cy="120" r="5" fill="#C4B5FD"/>
    
    <!-- Orbit 3 -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="150" cy="-90" r="12" fill="#7C3AED"/>
    <circle cx="-140" cy="100" r="8" fill="#8B5CF6"/>
    <circle cx="100" cy="140" r="6" fill="#A78BFA"/>
    <circle cx="-60" cy="-160" r="5" fill="#C4B5FD"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#purple)"/>
</svg>
